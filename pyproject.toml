[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aor-dv10-suite"
version = "0.1.0"
description = "Control software for the AOR AR-DV10 digital voice receiver: core USB protocol library, Yaesu-panel-style CLI, GUI, and web panel."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyserial>=3.5",
    "prompt_toolkit>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12.0", "zeroconf>=0.131"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
dv10-cli = "aor_dv10.cli.__main__:main"
dv10-web = "aor_dv10.web.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aor_dv10.gui" = ["fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["aor_dv10"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
